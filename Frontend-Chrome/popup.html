<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Colorizer</title>
  <link href="popup.css" rel="stylesheet" type="text/css" />
  <script type="module" src="popup.js"></script>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Manga Colorizer</h1>
      <p class="app-subtitle">AI-powered manga colorization</p>
    </header>

    <main class="app-content">
      <!-- API Configuration Section -->
      <section class="config-section">
        <!-- <h2 class="section-title">Configuration</h2> -->

        <div class="form-group">
          <label class="form-label" for="url-input-field">API URL</label>
          <div class="input-group">
            <input class="form-input" type="text" id="url-input-field" placeholder="Enter API endpoint URL" />
            <button class="btn btn-secondary" id="test-api">Test</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="maxactivefetches-input-field">Parallel Processing</label>
          <input class="form-input" type="number" min="1" max="10" id="maxactivefetches-input-field"
            title="Number of images to process simultaneously" />
        </div>
      </section>

      <!-- Processing & Display Options Section -->
      <section class="config-section">
        <h2 class="section-title">Processing & Display Options</h2>

        <div class="checkbox-group two-column">
          <div class="checkbox-item">
            <input class="checkbox" id="denoiser-checkbox" type="checkbox" />
            <label class="checkbox-label" for="denoiser-checkbox">
              <span class="checkbox-text">Use Denoiser</span>
              <!-- <span class="checkbox-description">Remove noise from images</span> -->
            </label>
          </div>

          <div class="checkbox-item">
            <input class="checkbox" id="colorizer-checkbox" type="checkbox" />
            <label class="checkbox-label" for="colorizer-checkbox">
              <span class="checkbox-text">Use Colorizer</span>
              <!-- <span class="checkbox-description">Add colors to grayscale images</span> -->
            </label>
          </div>

          <div class="checkbox-item">
            <input class="checkbox" id="upscaler-checkbox" type="checkbox" />
            <label class="checkbox-label" for="upscaler-checkbox">
              <span class="checkbox-text">Use Upscaler</span>
              <!-- <span class="checkbox-description">Enhance image resolution</span> -->
            </label>
          </div>

          <div class="checkbox-item">
            <input class="checkbox" id="showoriginal-checkbox" type="checkbox" />
            <label class="checkbox-label" for="showoriginal-checkbox">
              <span class="checkbox-text">Show Original</span>
              <!-- <span class="checkbox-description">Display original images</span> -->
            </label>
          </div>

          <div class="checkbox-item">
            <input class="checkbox" id="showcolorized-checkbox" type="checkbox" />
            <label class="checkbox-label" for="showcolorized-checkbox">
              <span class="checkbox-text">Show Colorized</span>
              <!-- <span class="checkbox-description">Display processed images</span> -->
            </label>
          </div>

          <div class="checkbox-item">
            <input class="checkbox" id="cache-checkbox" type="checkbox" />
            <label class="checkbox-label" for="cache-checkbox">
              <span class="checkbox-text">Use Cache</span>
              <!-- <span class="checkbox-description">Cache images on server</span> -->
            </label>
          </div>
        </div>

        <div class="form-group" style="display:none">
          <label class="form-label">Upscale Factor</label>
          <div class="radio-group" id="upscalefactor-selector">
            <div class="radio-item">
              <input class="radio" type="radio" id="upscale-factor-2" name="upscale-factor" value="2">
              <label class="radio-label" for="upscale-factor-2">2x</label>
            </div>
            <div class="radio-item">
              <input class="radio" type="radio" id="upscale-factor-4" name="upscale-factor" value="4" checked>
              <label class="radio-label" for="upscale-factor-4">4x</label>
            </div>
          </div>
        </div>

        <div class="form-group two-column">
          <div class="form-field">
            <label class="form-label" for="denoisesigma-input-field">Denoise Sigma</label>
            <input class="form-input" type="number" min="0" max="1000" id="denoisesigma-input-field"
              title="Noise level to expect from images" />
          </div>
          <div class="form-field">
            <label class="form-label" for="colortolerance-input-field">Color Tolerance</label>
            <input class="form-input" type="number" min="-1" max="1000" id="colortolerance-input-field"
              title="Threshold for determining if an image is grayscale" />
          </div>
        </div>

        <div class="form-group" style="display:none">
          <label class="form-label" for="colorstride-input-field">Color Stride</label>
          <input class="form-input" type="number" min="0" max="255" id="colorstride-input-field"
            title="Skip pixels when checking for color" />
        </div>
      </section>

      <!-- Manga Sites Section -->
      <section class="config-section accordion-section">
        <div class="accordion-header" id="manga-sites-header">
          <h2 class="section-title">Manga Sites</h2>
          <span class="accordion-icon">▼</span>
        </div>

        <div class="accordion-content collapsed" id="manga-sites-content">
          <div class="form-group">
            <label class="form-label" for="websites-input-field">Supported Sites</label>
            <textarea class="form-textarea" id="websites-input-field" rows="3"
              placeholder="Enter manga site domains, one per line" spellcheck="false"></textarea>
          </div>
        </div>
      </section>

      <section class="config-section">
        <div class="form-group">
          <button class="btn btn-outline" id="addsite" style="display: none;">Add Current Site</button>
        </div>
      </section>

      <!-- Action Buttons -->
      <section class="action-section">
        <div class="button-group">
          <button class="btn btn-primary" id="run">
            <span class="btn-icon">🎨</span>
            Colorize!
          </button>
          <button class="btn btn-secondary" id="force-run">
            <span class="btn-icon">🎯</span>
            Force Colorize!
          </button>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
